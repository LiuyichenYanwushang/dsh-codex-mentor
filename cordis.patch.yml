# Native positive-integer contracts have no unlimited sentinel; remove practical count quotas without patching the SDK.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  config:
    maxDepth: 1
    maxActiveSubagents: 9007199254740991
- id: agent-team
  name: '@deepseek-ai/dsh-experimental-agent-team'
  config:
    maxMembers: 9007199254740991
    maxTasks: 9007199254740991
    maxPendingMessagesPerMember: 64
    maxMessageBytes: 65536
    disposalTimeoutMs: 5000
- insert:
    - id: mentor-count-quota-migration
      name: './count-quota-migration.js'
      config:
        applied: false # One-time native editor migration; preserve future explicit operator changes.
    - id: codex-mentor-host
      name: './host-0.11.1.js'
      config:
        workerProvider: auto
        workerModel: deepseek-flash
        workerMaxTokens: 384000
        maxConcurrentWorkers: 0 # No default count quota; optional positive values limit only the subagent backend.
        requireGptMentor: false
        workerBackend: auto # auto | subagent | team; leaders keep the session's model.
    - id: codex-mentor-gui
      name: './gui/index.js'
      disabled: true # Collaboration is mentor-controlled; no extra manual composer entry.
    - id: preset-codex-mentor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: codex-mentor
        name: Mentor · 导师协作
        description: 当前模型担任 Leader，默认 Flash 执行；对代码严格、对人仁慈，批判审查与独立验收；导师自主管理长期记忆、成员复用、通讯和讨论。
        order: 5
        plugins:
          - id: mentor-capability-guard
            name: dsh-codex-mentor/capability-guard
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model, using Mentor collaboration in DeepSeek Harness. Your current session model is the Leader; changing it affects later requests, not the workers' pinned models.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: mentor-compaction
                name: dsh-codex-mentor/compaction
                config:
                  thresholdRatio: 0.75
                  headroomTokens: 32768
                  retainRatio: 0.16
                  maxTokens: 8192
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
